version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Breaking major upgrades of the compiler and of the GraphQL peer used by
    # adapter tests need a dedicated, reviewed migration. Minor and patch
    # updates for them still flow through the grouped PR below.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: graphql
        update-types: ["version-update:semver-major"]
    groups:
      # Only minor/patch updates are bundled; any other semver-major update
      # arrives as its own PR so it can be reviewed in isolation.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
